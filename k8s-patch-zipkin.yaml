apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: sock-shop
spec:
  template:
    spec:
      containers:
      - name: user
        env:
        - name: ZIPKIN
          value: "http://jaeger-collector.observability.svc.cluster.local:9411/api/v2/spans"
        - name: ZIPKIN_HOST
          value: "jaeger-collector.observability.svc.cluster.local"
        - name: ZIPKIN_PORT
          value: "9411"
        - name: ZIPKIN_BASE_URL
          value: "http://jaeger-collector.observability.svc.cluster.local:9411"
        - name: CONTAINER_NAME
          value: "user"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
